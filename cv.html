<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CV · Ashkan Samimi</title>
<meta name="description" content="Curriculum vitae of Ashkan Samimi, Leibniz-HKI, Jena.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --paper:#F3F6F7; --surface:#FFFFFF; --ink:#0D1B24; --muted:#566A73; --rule:#D5DEE1; --field:#7A8D94;
  --blue:#0A6970; --on-blue:#FFFFFF; --red:#4FD8CF; --header-bg:rgb(243 246 247 / .9);
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Helvetica Neue", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#0A161D; --surface:#10222B; --ink:#E7F0F2; --muted:#8AA2A9; --rule:#1E3540; --field:#57737D; --blue:#56D2C8; --on-blue:#061117; --red:#4FD8CF; --header-bg:rgb(10 22 29 / .9); color-scheme:dark; }
}
:root[data-theme="dark"]{ --paper:#0A161D; --surface:#10222B; --ink:#E7F0F2; --muted:#8AA2A9; --rule:#1E3540; --field:#57737D; --blue:#56D2C8; --on-blue:#061117; --red:#4FD8CF; --header-bg:rgb(10 22 29 / .9); color-scheme:dark; }
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{ margin:0; display:flex; flex-direction:column; background:var(--paper); color:var(--ink); font:1rem/1.6 var(--f-body); }
a{ color:var(--blue); }
:focus-visible{ outline:2px solid var(--blue); outline-offset:3px; }
.wrap{ max-width:1180px; margin-inline:auto; padding-inline:clamp(16px, 4vw, 40px); width:100%; }
header{ border-bottom:1px solid var(--rule); background:var(--header-bg); }
.nav{ display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:64px; flex-wrap:wrap; }
.brand{ display:flex; align-items:center; gap:10px; color:var(--ink); text-decoration:none; font:600 1.1rem var(--f-display); }
.brand i{ width:22px; height:22px; border-radius:50%; background:radial-gradient(circle at 36% 32%, #B9F3EE 0 18%, #4FD8CF 46%, #0E6B6E 100%); }
.bar{ display:flex; align-items:center; justify-content:space-between; gap:12px 20px; flex-wrap:wrap; padding-block:18px; }
h1{ margin:0; font:600 clamp(1.5rem, 3vw, 2rem)/1.1 var(--f-display); letter-spacing:-.02em; }
.label{ font:500 .72rem var(--f-mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.actions{ display:flex; gap:10px; flex-wrap:wrap; }
.btn{ display:inline-flex; align-items:center; min-height:44px; padding:.65em 1.1em; border-radius:999px; font-weight:500; text-decoration:none; border:1.5px solid transparent; }
.btn-primary{ background:var(--blue); color:var(--on-blue); }
.btn-outline{ border-color:var(--field); color:var(--ink); }
.viewer{ flex:1; min-height:70vh; padding-bottom:16px; }
.viewer iframe{ width:100%; height:100%; min-height:70vh; border:1px solid var(--rule); border-radius:6px; background:var(--surface); display:block; }
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="index.html"><i aria-hidden="true"></i>Ashkan Samimi</a>
    <a href="index.html">← Back to home</a>
  </div>
</header>
<div class="wrap bar">
  <div>
    <p class="label" style="margin:0 0 4px">Curriculum vitae</p>
    <h1>Ashkan Samimi</h1>
  </div>
  <div class="actions">
    <a class="btn btn-primary" href="assets/AshkanSamimi_CV.pdf" download>Download PDF</a>
    <a class="btn btn-outline" href="assets/AshkanSamimi_CV.pdf" target="_blank" rel="noopener">Open in new tab</a>
  </div>
</div>
<main class="wrap viewer">
  <!-- On phones many browsers can't show PDFs inline; the buttons above always work. -->
  <iframe src="assets/AshkanSamimi_CV.pdf#view=FitH&amp;toolbar=0&amp;navpanes=0" title="Ashkan Samimi CV (PDF)"></iframe>
</main>
</body>
</html>
