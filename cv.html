<!doctype html>
<html lang="en">
<head>

  <link rel="stylesheet" href="assets/styles.css" />

<body>
  <!-- Same background as homepage -->
  <div
    class="bg-image"
    style="
      --bg-url: url('../assets/s19.tif');
      --bg-blur: 0px;
      --bg-opacity: 0.2;

  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html">Ashkan Samimi</a>

      <nav class="nav-links" aria-label="Primary">

      <p class="muted-note">
